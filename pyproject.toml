[project]
name = "auto-book"
version = "0.1.0"
description = "Autonomous book-writing agent pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.9.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
auto-book = "auto_book.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
